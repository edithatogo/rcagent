name: Quality

on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.os == 'ubuntu-latest' && format('Python validation ({0})', matrix.python) || format('validate ({0})', matrix.os) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.15.2"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.13.8

      - name: Install locked validation dependencies
        run: uv sync --locked --extra validate --extra test --extra lint --extra assurance

      - name: Reject growth in the legacy typing baseline
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python -m tools.quality_gate baseline --base "$BASE_REV"

      - name: Run deterministic strict repository gate
        run: uv run --no-sync python -m tools.full_validation ${{ runner.os == 'Windows' && '--defer-coverage-floor' || '' }}

      - name: Retain branch coverage for the required combined gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.os }}-py${{ matrix.python }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python == '3.15.2'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  coverage:
    name: Complete matrix branch coverage
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15.2"
      - name: Install locked coverage dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          uv sync --locked --extra test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: coverage-inputs
          merge-multiple: false
      - name: Require every matrix input and enforce 90 percent combined coverage
        shell: bash
        run: |
          uv run --no-sync python -m tools.coverage_inputs coverage-inputs
          uv run --no-sync python -m coverage combine --keep coverage-inputs/*/.coverage
          uv run --no-sync python -m coverage report --fail-under=90
          uv run --no-sync python -m coverage xml -o coverage-combined.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-branch-coverage
          path: coverage-combined.xml
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Release boundary mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
      - name: Install locked mutation dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          uv sync --locked --extra validate --extra test --extra assurance
      - name: Verify unmodified tests before mutation
        run: uv run --no-sync python -m pytest tests/test_release_admission.py -q
      - name: Mutate the public release rights and privacy boundary
        run: >-
          uv run --no-sync python -m pytest tests/test_release_admission.py -q
          --gremlins --gremlin-targets=tools/release_admission.py
          --gremlin-no-coverage-filter
          --gremlin-report=json --gremlin-workers=2
          --gremlin-mutant-timeout=10 --gremlin-coverage-timeout=60
          --strict-pardons --max-pardons=0
      - name: Require 100 percent real kills, without timeouts, errors or pardons
        run: uv run --no-sync python -m tools.quality_gate mutation coverage/gremlins/gremlins.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-boundary-mutation
          path: coverage/gremlins/gremlins.json
          if-no-files-found: error
          retention-days: 14

  profile:
    name: Synthetic CPU and memory profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
      - name: Install locked profiler dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          uv sync --locked --extra validate --extra profile
      - name: Measure actual synthetic schema validation and provenance hashing
        shell: bash
        run: |
          mkdir -p quality-artifacts
          uv run --no-sync python -m scalene run -o quality-artifacts/scalene-profile.json tools/profile_workload.py | tee quality-artifacts/workload.json
      - name: Verify CPU and memory measurements are present
        run: uv run --no-sync python -m tools.quality_gate profile quality-artifacts/scalene-profile.json --workload quality-artifacts/workload.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-scalene-profile
          path: quality-artifacts/
          if-no-files-found: error
          retention-days: 14

  required-quality:
    name: validate (ubuntu-latest)
    if: ${{ always() }}
    needs: [validate, mutation, profile, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every strict validation, mutation, profile and coverage job to succeed
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          PROFILE_RESULT: ${{ needs.profile.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$MUTATION_RESULT" = success
          test "$PROFILE_RESULT" = success
          test "$COVERAGE_RESULT" = success

  prose:
    name: Prose lint (Vale)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true # advisory until the documentation corpus is fully cleaned up
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Vale prose lint
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0; handles GitHub's 20,000-line diff limit
        with:
          files: all
          fail_on_error: false
