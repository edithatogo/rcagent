name: Quality

on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[validate,test,lint]"

      - name: Ruff lint
        run: python -m ruff check tools tests

      - name: Type check (ty)
        run: python -m ty check tools tests

      - name: Type check (basedpyright)
        run: python -m basedpyright

      - name: Gremlins scan (invisible/bidi characters)
        run: python -m tools.check_gremlins .

      - name: Validate repository governance
        run: python -m tools.validate_repository

      - name: Validate and run deterministic benchmark contracts
        run: |
          python -m tools.benchmark_harness validate
          python -m tools.benchmark_harness run --suite regression

      - name: Run tests with coverage
        run: python -m pytest --cov=tools --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  prose:
    name: Prose lint (Vale)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true # advisory until the documentation corpus is fully cleaned up
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Vale prose lint
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          files: all
          fail_on_error: false
