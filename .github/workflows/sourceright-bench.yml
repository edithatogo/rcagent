name: SourceRight Bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out repository with vendored plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0

      - name: Build SourceRight (locked)
        working-directory: .agents/plugins/sourceright
        run: cargo build --locked

      - name: Run offline fixture bench
        working-directory: .agents/plugins/sourceright
        run: ./target/debug/sourceright bench --json | tee sourceright-bench.json

      - name: Upload bench receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sourceright-bench
          path: .agents/plugins/sourceright/sourceright-bench.json
