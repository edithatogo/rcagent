name: Agent Skill Conformance

on:
  pull_request:
    paths:
      - "skills/**"
      - "adapters/**"
      - "evaluations/skills/**"
      - "tools/check_skill_drift.py"
      - "tools/run_skill_conformance.py"
      - "tools/validate_skill.py"
      - "tools/validate_skill_profile.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/skill-conformance.yml"
  push:
    branches:
      - master
      - "codex/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15.2"

      - name: Install locked validation and pinned official skills-ref dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          uv sync --locked --extra validate --extra test --group conformance
      - name: Validate and emit current-conformance receipt
        run: uv run --no-sync python -m tools.run_skill_conformance --output skill-conformance-receipt.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: skill-conformance-receipt
          path: skill-conformance-receipt.json

      - name: Run contract tests
        if: always()
        run: uv run --no-sync python -m pytest
