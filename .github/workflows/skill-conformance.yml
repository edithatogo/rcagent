name: Agent Skill Conformance

on:
  pull_request:
    paths:
      - "skills/**"
      - "adapters/**"
      - "evaluations/skills/**"
      - "tools/check_skill_drift.py"
      - "tools/run_skill_conformance.py"
      - "tools/validate_skill.py"
      - "tools/validate_skill_profile.py"
      - ".github/workflows/skill-conformance.yml"
  push:
    branches:
      - master
      - "codex/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[validate,test]"

      - name: Install pinned official skills-ref
        shell: bash
        run: |
          git clone --quiet https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills checkout --quiet 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install --disable-pip-version-check /tmp/agentskills/skills-ref
      - name: Validate and emit current-conformance receipt
        run: python -m tools.run_skill_conformance --output skill-conformance-receipt.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-conformance-receipt
          path: skill-conformance-receipt.json

      - name: Run contract tests
        run: python -m pytest
