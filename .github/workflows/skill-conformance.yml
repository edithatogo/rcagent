name: Agent Skill Conformance

on:
  pull_request:
    paths:
      - "skills/**"
      - "adapters/**"
      - "evaluations/skills/**"
      - "tools/check_skill_drift.py"
      - "tools/run_skill_conformance.py"
      - "tools/validate_skill.py"
      - "tools/validate_skill_profile.py"
      - ".github/workflows/skill-conformance.yml"
  push:
    branches:
      - master
      - "codex/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[validate,test]"

      - name: Install pinned official skills-ref
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate and emit current-conformance receipt
        run: python -m tools.run_skill_conformance --output skill-conformance-receipt.json

      - uses: actions/upload-artifact@v7
        with:
          name: skill-conformance-receipt
          path: skill-conformance-receipt.json

      - name: Run contract tests
        run: python -m pytest
