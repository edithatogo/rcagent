[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safety-systems-workbench"
version = "0.0.0"
description = "Validation and orchestration harness for the Safety Systems Workbench"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validate = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0.2,<7",
]
lint = [
  "ruff>=0.6",
  "ty",
  "basedpyright>=1.18",
]
test = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "evaluations",
  "evaluation/results",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = ["E501"] # long lines are governed by formatting intent, not CI failure

[tool.basedpyright]
include = ["tools", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportAttributeAccessIssue = "error"
