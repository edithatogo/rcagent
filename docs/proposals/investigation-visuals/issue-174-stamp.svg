<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-label="STAMP: controlled process and feedback synthetic diagram"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4d687f"/></marker></defs><rect width="1280" height="680" fill="white"/><rect x="26" y="24" width="1228" height="90" rx="16" fill="#eef4f9"/><text x="51" y="66" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#294055">STAMP: controlled process and feedback</text><text x="51" y="93" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#294055">Controllers, control actions and return feedback are distinct semantic types</text><rect x="450" y="145" width="380" height="75" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="640" y="188.5" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">Clinical team (controller)</text><rect x="450" y="280" width="380" height="75" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="640" y="323.5" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">EHR titration module (controller)</text><rect x="450" y="440" width="380" height="76" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="640" y="484" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">Glycaemic process (controlled)</text><path d="M640 220 L640 280" fill="none" stroke="#4d687f" stroke-width="3" marker-end="url(#arr)"/><text x="664" y="253" font-family="Arial" font-size="15" fill="#465d72">target / weight</text><path d="M640 355 L640 440" fill="none" stroke="#4d687f" stroke-width="3" marker-end="url(#arr)"/><text x="661" y="394" font-family="Arial" font-size="15" fill="#465d72">dose recommendation</text><path d="M450 490 L330 490 L330 317 L450 317" fill="none" stroke="#4d687f" stroke-width="3" marker-end="url(#arr)"/><text x="75" y="405" font-family="Arial" font-size="15" fill="#465d72">capillary glucose feedback</text><path d="M830 316 L980 316 L980 185 L830 185" fill="none" stroke="#4d687f" stroke-width="3" marker-end="url(#arr)"/><text x="858" y="268" font-family="Arial" font-size="15" fill="#465d72">missing hypoglycaemia feedback</text><text x="65" y="160" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#294055">Unsafe control action needs</text><text x="65" y="185" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#294055">a separate evidence profile.</text><rect x="28" y="574" width="1224" height="80" rx="14" fill="#fff8eb" stroke="#eacb9b"/><text x="49" y="604" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#294055">Boundary / rejection case</text><text x="49" y="632" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#294055">A drawn unsafe-control-action annotation is not proof of fault or inadequate clinician conduct.</text><text x="1240" y="670" font-size="12" text-anchor="end" font-family="Arial" fill="#687a89">Synthetic proposal mock-up | not clinically qualified or implemented in Mermaid</text></svg>