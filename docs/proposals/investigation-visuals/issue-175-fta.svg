xt><text x="1005" y="395.5" font-family="Arial" text-anchor="middle" font-size="18" font-weight="600" fill="#29445b">fails</text><ellipse cx="235" cy="461" rx="52" ry="34" fill="#e3eef8" stroke="#61778c" stroke-width="2.5"/><text x="235" y="467" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial" fill="#23445a">OR</text><ellipse cx="1005" cy="461" rx="52" ry="34" fill="#e3eef8" stroke="#61778c" stroke-width="2.5"/><text x="1005" y="467" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial" fill="#23445a">OR</text><rect x="70" y="505" width="170" height="51" rx="12" fill="#e9f1f7" stroke="#647d93" stroke-width="2"/><text x="155" y="536.5" font-family="Arial" text-anchor="middle" font-size="18" font-weight="600" fill="#29445b">Dose transcription</text><rect x="255" y="505" width="190" height="51" rx="12" fill="#fff1e1" stroke="#b09a77" stroke-width="2"/><text x="350" y="536.5" font-family="Arial" text-anchor="middle" font-size="18" font-weight="600" fill="#29445b">Unquantified UI lag</text><rect x="805" y="505" width="180" height="51" rx="12" fill="#e9f1f7" stroke="#647d93" stroke-width="2"/><text x="895" y="536.5" font-family="Arial" text-anchor="middle" font-size="18" font-weight="600" fill="#29445b">Interruptions</text><rect x="995" y="505" width="220" height="51" rx="12" fill="#e9f1f7" stroke="#647d93" stroke-width="2"/><text x="1105" y="536.5" font-family="Arial" text-anchor="middle" font-size="18" font-weight="600" fill="#29445b">Fatigue hypothesis</text><path d="M640 207 L640 233" stroke="#4b647b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M588 267 L235 267 L235 345" stroke="#4b647b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M692 267 L1005 267 L1005 345" stroke="#4b647b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M235 410 L235 427" stroke="#4b647b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1005 410 L1005 427" stroke="#4b647b" stroke-width="3"