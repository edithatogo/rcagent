<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-label="SEIPS: sociotechnical work-system interactions synthetic diagram"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4d687f"/></marker></defs><rect width="1280" height="680" fill="white"/><rect x="26" y="24" width="1228" height="90" rx="16" fill="#eef4f9"/><text x="51" y="66" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#294055">SEIPS: sociotechnical work-system interactions</text><text x="51" y="93" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#294055">Person, task, tools, organisation, environment and patient/staff experience</text><rect x="500" y="285" width="280" height="70" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="640" y="326" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">Work as done</text><rect x="95" y="165" width="240" height="70" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="215" y="206" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">People / team</text><rect x="445" y="155" width="270" height="70" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="580" y="196" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">Tasks and workload</text><rect x="895" y="165" width="240" height="70" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="1015" y="206" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#234057">Technology / EHR</text><rect x="95" y="409" width="240" height="70" rx="14" fill="#e9f1f7" stroke="#6f879c" stroke-width="2"/><text x="215" y="450" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-wei